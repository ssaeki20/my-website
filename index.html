<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わたしのWebサイト</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        h2 {
            font-size: 1.8rem;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 600;
            position: relative;
            padding-bottom: 15px;
        }
        
        h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        
        p {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.8;
            margin-top: 15px;
        }
        
        .emoji {
            font-size: 1.3rem;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ わたしのWebサイト ✨</h1>
        <h2>自己紹介</h2>
        <p><span class="emoji">📚</span>趣味は読書です</p>
    </div>
</body>
</html>
